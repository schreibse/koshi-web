name = "koshisoftware"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = true
routes = [{ pattern = "koshisoftware.pe/*", zone_name = "koshisoftware.pe" }]

[assets]
directory = "dist/apps/web/browser"
binding = "ASSETS"
not_found_handling = "404-page"
# Every page path, so the Worker can answer what no file holds (blog, old slugs); files with a dot stay pure assets.
run_worker_first = ["/*", "!/*.*"]

[[d1_databases]]
binding = "DB"
database_name = "koshi-reclamaciones"
database_id = "44544861-9656-4972-b0c5-8f2ace9fd9f4"
migrations_dir = "worker/migrations"

[[d1_databases]]
binding = "BLOG"
database_name = "koshi-blog"
database_id = "e767c744-1e65-4d45-80cb-3898a5508c4f"
migrations_dir = "worker/blog-migrations"

# Previews get no secrets, so the Libro form stops at Turnstile before it writes here.
[[previews.d1_databases]]
binding = "DB"
database_id = "44544861-9656-4972-b0c5-8f2ace9fd9f4"

[[previews.d1_databases]]
binding = "BLOG"
database_id = "e767c744-1e65-4d45-80cb-3898a5508c4f"

[alias]
"angular-server" = "./dist/apps/web/server/server.mjs"
# platform-server imports it for HttpClient's XHR backend, which the site never uses.
"xhr2" = "./worker/xhr2.ts"
