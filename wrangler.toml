name = "koshisoftware"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = true
routes = [{ pattern = "koshisoftware.pe/*", zone_name = "koshisoftware.pe" }]

[assets]
directory = "dist/apps/web/browser"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "koshi-reclamaciones"
database_id = "44544861-9656-4972-b0c5-8f2ace9fd9f4"
migrations_dir = "worker/migrations"

# Previews get no secrets, so the Libro form stops at Turnstile before it writes here.
[[previews.d1_databases]]
binding = "DB"
database_id = "44544861-9656-4972-b0c5-8f2ace9fd9f4"
